name: Feature or improvement
description: Suggest a new analysis, model, dashboard view or other improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. For a new model or metric, say which baseline it should beat.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data needed
      description: Any new dataset, with its source and licence.
